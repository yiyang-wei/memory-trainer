<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4, and iOS
         ignores it anyway. Accidental double-tap zoom is already handled by the
         `touch-action: manipulation` on buttons in index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF0F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Memory Trainer" />
    <meta name="description" content="A mobile-first pattern and sequence memory training game." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS has no SVG support here and silently falls back to a screenshot, so this
         one must be an opaque PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Memory Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
